# Movement Network Testnet - Archival Fullnode Configuration
#
# An archival node maintains complete blockchain history by disabling ledger pruning.
# Use this configuration when you need:
#   - Complete transaction history from genesis
#   - Historical state queries
#   - Full blockchain data for indexers
#
# Download genesis files from the parent directory (testnet/):
#   - genesis.blob
#   - waypoint.txt
#   - genesis_waypoint.txt
#
# To bootstrap with existing data, use l1_restore.sh to restore from Movement Labs backups.

base:
  role: "full_node"
  data_dir: "/opt/aptos/data"
  waypoint:
    from_file: "/opt/aptos/waypoint.txt"

execution:
  genesis_file_location: "/opt/aptos/genesis.blob"
  genesis_waypoint:
    from_file: "/opt/aptos/genesis_waypoint.txt"

storage:
  rocksdb_configs:
    enable_storage_sharding: false
  # ARCHIVAL NODE: Disable ledger pruning to maintain complete blockchain history
  storage_pruner_config:
    ledger_pruner_config:
      enable: false

full_node_networks:
  - network_id: "public"
    # Seeds only: the four Movement validator fullnodes. On-chain discovery is off so
    # the node connects to exactly these peers and nothing else.
    discovery_method: "none"
    listen_address: "/ip4/0.0.0.0/tcp/6182"
    seeds:
      5f3ccf14d5217249f94bdd752c2fa42d7e309522845001b62f0a05fbee7e1f2b:
        addresses:
        - "/dns/consensus-1.testnet.movementnetwork.xyz/tcp/6182/noise-ik/5f3ccf14d5217249f94bdd752c2fa42d7e309522845001b62f0a05fbee7e1f2b/handshake/0"
        role: "Upstream"
      5f6930a1eff6d52bb452434dbbd7fbfd86cff9b63c19513c00d8ebf70dcc1f4c:
        addresses:
        - "/dns/consensus-2.testnet.movementnetwork.xyz/tcp/6182/noise-ik/5f6930a1eff6d52bb452434dbbd7fbfd86cff9b63c19513c00d8ebf70dcc1f4c/handshake/0"
        role: "Upstream"
      ba9898cd14fe8b995991fbed8f84f6d981c62faa82e7fca1a95995aef1b55134:
        addresses:
        - "/dns/consensus-3.testnet.movementnetwork.xyz/tcp/6182/noise-ik/ba9898cd14fe8b995991fbed8f84f6d981c62faa82e7fca1a95995aef1b55134/handshake/0"
        role: "Upstream"
      9264dad024936304469b904b8c80366246dff8121de2cfa4cacad96d67b85f06:
        addresses:
        - "/dns/consensus-4.testnet.movementnetwork.xyz/tcp/6182/noise-ik/9264dad024936304469b904b8c80366246dff8121de2cfa4cacad96d67b85f06/handshake/0"
        role: "Upstream"

api:
  enabled: true
  address: 0.0.0.0:8080

state_sync:
  state_sync_driver:
    bootstrapping_mode: DownloadLatestStates
    continuous_syncing_mode: ApplyTransactionOutputs
